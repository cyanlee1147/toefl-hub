<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡館詞典 Coffee Shop Lexicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --roast:#F5E9D8;
    --roast2:#EFDFC6;
    --roast3:#E8D5B5;
    --crema:#FFFBF3;
    --parchment:#FFFBF3;
    --cherry:#B5651D;
    --cherry-dim:#8C4E17;
    --caramel:#A9702E;
    --moss:#7A5A3E;
    --ink:#3A2415;
    --ink-dim:#7A5A3E;
    --text-light:#4A2E1D;
    --text-light-dim:#8A6B4E;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -5%, rgba(169,112,46,0.10), transparent 55%),
      linear-gradient(180deg, var(--roast) 0%, var(--roast2) 50%, var(--roast3) 100%);
    background-attachment:fixed;
    color:var(--text-light);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
    html{scroll-behavior:auto;}
  }

  /* ---------- STEAM ---------- */
  .steam-layer{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .steam{
    position:absolute;
    bottom:-10vh;
    width:3px;
    border-radius:3px;
    background:linear-gradient(180deg, rgba(74,46,29,0.0), rgba(74,46,29,0.16), rgba(74,46,29,0.0));
    filter:blur(2px);
    animation:steamRise linear infinite;
  }
  @keyframes steamRise{
    0%{ transform:translateY(0) translateX(0) scaleY(0.6); opacity:0; }
    12%{ opacity:0.5; }
    50%{ transform:translateY(-55vh) translateX(var(--sway,14px)) scaleY(1.1); }
    88%{ opacity:0.2; }
    100%{ transform:translateY(-105vh) translateX(calc(var(--sway,14px) * -1)) scaleY(1.3); opacity:0; }
  }

  /* ---------- HERO ---------- */
  header.hero{
    position:relative;
    z-index:1;
    padding:60px 24px 0;
  }
  .hero-inner{
    max-width:960px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:32px;
    flex-wrap:wrap;
    padding-bottom:40px;
  }
  .eyebrow{
    font-family:'Caveat',cursive;
    font-weight:600;
    font-size:22px;
    color:var(--caramel);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(32px,5.2vw,50px);
    line-height:1.08;
    margin:0 0 10px;
    color:var(--text-light);
  }
  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--text-light-dim);
  }
  .hero-sub{
    font-size:14.5px;
    color:var(--text-light-dim);
    max-width:48ch;
    line-height:1.65;
    margin:0;
  }
  .count-block{ text-align:right; flex-shrink:0; }
  .count-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(52px,8.5vw,80px);
    line-height:0.85;
    color:var(--caramel);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(204,146,67,0.3);
  }
  .count-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-light-dim);
    margin-top:6px;
  }

  /* stitched divider like a burlap sack seam */
  .stitch-divider{
    max-width:960px;
    margin:0 auto;
    height:0;
    border-top:2px dashed rgba(74,46,29,0.2);
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(245,233,216,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(74,46,29,0.12);
    padding:14px 24px;
  }
  .tabs-inner{
    max-width:960px;
    margin:0 auto;
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:thin;
    padding-bottom:2px;
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    background:transparent;
    border:1px solid rgba(74,46,29,0.2);
    color:var(--text-light-dim);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab-btn:hover{ color:var(--text-light); border-color:rgba(74,46,29,0.45); }
  .tab-btn.active{
    background:var(--caramel);
    border-color:var(--caramel);
    color:#FFFBF3;
    font-weight:600;
  }
  .tab-btn .n{ opacity:0.65; margin-left:4px; }
  .tab-btn.active .n{ opacity:0.55; }

  /* ---------- MAIN ---------- */
  main{
    position:relative;
    z-index:1;
    max-width:960px;
    margin:0 auto;
    padding:36px 24px 90px;
  }
  .date-section{ margin-bottom:46px; }
  .date-heading{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 18px;
    padding-bottom:8px;
    border-bottom:1px dashed rgba(74,46,29,0.18);
  }
  .date-heading .d{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    color:var(--text-light);
  }
  .date-heading .c{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-light-dim);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:16px;
  }

  /* ---------- FLIP CARD ---------- */
  .flashcard{
    perspective:1200px;
    height:170px;
    cursor:pointer;
  }
  .flashcard-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }

  .card-face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:10px;
    padding:16px;
    display:flex;
    flex-direction:column;
  }

  .card-front{
    background:
      radial-gradient(circle at 85% 15%, rgba(255,223,177,0.18), transparent 55%),
      linear-gradient(160deg, #8A5A34, #6B4226);
    border:1px solid rgba(74,46,29,0.15);
    justify-content:space-between;
    box-shadow:0 10px 22px -14px rgba(74,46,29,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .front-top{ display:flex; justify-content:flex-end; }
  .front-top .speak-btn{
    background:rgba(58,36,21,0.55);
    color:#F3DFC0;
  }
  .front-top .speak-btn:hover{ background:var(--cherry); color:#fff; }
  .front-word{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    line-height:1.25;
    color:#FBF1DE;
    margin:auto 0;
  }
  .flip-hint{
    font-family:'Caveat',cursive;
    font-size:15px;
    color:#D8B98E;
    text-align:right;
  }

  .card-back{
    background:var(--parchment);
    color:var(--ink);
    transform:rotateY(180deg);
    border:1px solid #e3cfa4;
    box-shadow:0 10px 22px -14px rgba(0,0,0,0.5);
    overflow-y:auto;
  }
  .back-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .back-word{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.2;
    margin:0;
  }
  .pos-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.03em;
    color:#fff;
    background:var(--moss);
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    margin-top:2px;
    display:inline-block;
  }
  .speak-btn{
    border:none;
    background:#6B4226;
    color:#F3DFC0;
    width:26px;
    height:26px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .speak-btn:hover{ background:var(--cherry-dim); transform:scale(1.08); }
  .speak-btn:active{ transform:scale(0.92); }
  .speak-btn.playing{ background:var(--cherry); color:#fff; }
  .speak-btn svg{ width:12px; height:12px; }

  .zh-meaning{
    font-size:13px;
    color:var(--ink-dim);
    margin:4px 0 8px;
    line-height:1.4;
  }
  .example-row{
    display:flex;
    align-items:flex-start;
    gap:6px;
    border-top:1px dashed #e3cfa4;
    padding-top:8px;
    margin-top:auto;
  }
  .example-text{ flex:1; min-width:0; }
  .example-en{
    font-size:11.5px;
    line-height:1.45;
    color:#3d2a17;
    margin:0 0 3px;
  }
  .example-en mark{
    background:none;
    color:var(--cherry-dim);
    font-weight:600;
    text-decoration:underline;
    text-decoration-color:rgba(125,46,32,0.4);
    text-decoration-thickness:2px;
    text-underline-offset:2px;
  }
  .example-zh{
    font-size:11px;
    line-height:1.4;
    color:#8a7256;
    margin:0;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:28px 24px 40px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-light-dim);
    letter-spacing:0.04em;
  }

  .no-tts-note{
    display:none;
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--cherry);
    text-align:center;
    padding:6px 24px 0;
  }
</style>
</head>

-02", "word": "transient", "pos": "adj.", "zh": "短暫的，轉瞬即逝的", "en": "The beauty of a sunset is often described as transient, lasting only a few precious moments.", "zhEx": "夕陽之美常被形容為短暫的，只持續幾個珍貴的片刻。"}, {"date": "2026-08-02", "word": "derided", "pos": "v.", "zh": "嘲笑，譏諷", "en": "His unconventional ideas were initially derided by his peers, but later proved to be innovative.", "zhEx": "他非傳統的想法起初被同儕嘲笑，但後來證明相當創新。"}, {"date": "2026-08-02", "word": "convention", "pos": "n.", "zh": "慣例，常規", "en": "Breaking with literary convention, the author decided to write the novel from multiple perspectives.", "zhEx": "這位作者打破文學慣例，決定以多重視角來寫這部小說。"}, {"date": "2026-08-02", "word": "reshaped", "pos": "v.", "zh": "重新塑造，改變", "en": "The invention of the internet has fundamentally reshaped how people communicate and access information.", "zhEx": "網路的發明從根本上重塑了人們溝通與取得資訊的方式。"}, {"date": "2026-08-02", "word": "autonomy", "pos": "n.", "zh": "自主性，獨立", "en": "The students were given more autonomy in choosing their research topics, fostering greater engagement.", "zhEx": "學生在選擇研究主題上獲得更多自主權，促進了更高的投入度。"}, {"date": "2026-08-02", "word": "expressive", "pos": "adj.", "zh": "有表現力的，善於表達的", "en": "Her dance performance was incredibly expressive, conveying a wide range of emotions without words.", "zhEx": "她的舞蹈表演極具表現力，無需言語就能傳達豐富的情感。"}, {"date": "2026-08-01", "word": "heuristic", "pos": "n.", "zh": "啟發式方法；探索式方法", "en": "Developing a simple heuristic can help solve complex problems more quickly, even if it doesn't guarantee the optimal solution.", "zhEx": "建立一個簡單的啟發式方法，能幫助更快解決複雜問題，即使不保證是最佳解。"}, {"date": "2026-08-01", "word": "skewed", "pos": "adj.", "zh": "歪曲的；有偏差的", "en": "The survey results were skewed because the sample population was not representative of the entire demographic.", "zhEx": "這項調查的結果出現偏差，因為樣本族群並不能代表整體人口。"}, {"date": "2026-08-01", "word": "evidence", "pos": "n.", "zh": "證據；證明", "en": "Detectives are still gathering evidence to support their theory about the crime.", "zhEx": "偵探仍在蒐集證據，以支持他們對這起犯罪的推 function escapeHTML(s){
  return s.replace(/[&<>]/g, c => ({'&':'&lt;','>':'&gt;','&':'&amp;'}[c] || c));
}
function escapeHTMLSafe(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(ex, word){
  const escaped = escapeHTMLSafe(ex);
  const escWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp("(" + escWord + ")", "i");
  return escaped.replace(re, "<mark>$1</mark>");
}

function fmtDateHeading(d){
  const [y,m,day] = d.split("-");
  return `${m}/${day}`;
}

const dates = [...new Set(VOCAB.map(v => v.date))].sort();

document.getElementById('totalCount').textContent = VOCAB.length;

// Tabs
const tabBar = document.getElementById('tabBar');
function makeTab(label, count, filterVal, active){
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (active ? ' active' : '');
  btn.dataset.filter = filterVal;
  btn.innerHTML = `${label}<span class="n">${count}</span>`;
  btn.onclick = () => setFilter(filterVal);
  return btn;
}
tabBar.appendChild(makeTab('全部', VOCAB.length, 'all', true));
dates.forEach(d => {
  const count = VOCAB.filter(v => v.date === d).length;
  tabBar.appendChild(makeTab(fmtDateHeading(d), count, d, false));
});

function setFilter(val){
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === val);
  });
  document.querySelectorAll('.date-section').forEach(sec => {
    sec.style.display = (val === 'all' || sec.dataset.date === val) ? '' : 'none';
  });
}

// Main content
const main = document.getElementById('main');
dates.forEach(d => {
  const words = VOCAB.filter(v => v.date === d);
  const section = document.createElement('section');
  section.className = 'date-section';
  section.dataset.date = d;

  const heading = document.createElement('div');
  heading.className = 'date-heading';
  heading.innerHTML = `<span class="d">${fmtDateHeading(d)}</span><span class="c">${words.length} words</span>`;
  section.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'grid';

  words.forEach(v => {
    const card = document.createElement('div');
    card.className = 'flashcard';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', `Flashcard for ${v.word}`);
    card.innerHTML = `
      <div class="flashcard-inner">
        <div class="card-face card-front">
          <div class="front-top">
            <button class="speak-btn front-speak" aria-label="Pronounce ${escapeHTMLSafe(v.word)}">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
          <div class="front-word">${escapeHTMLSafe(v.word)}</div>
          <div class="flip-hint">點擊翻面 ⟳</div>
        </div>
        <div class="card-face card-back">
          <div class="back-top">
            <div>
              <p class="back-word">${escapeHTMLSafe(v.word)}</p>
              <span class="pos-badge">${escapeHTMLSafe(v.pos)}</span>
            </div>
            <button class="speak-btn word-speak" aria-label="Pronounce ${escapeHTMLSafe(v.word)}">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
          <p class="zh-meaning">${escapeHTMLSafe(v.zh)}</p>
          <div class="example-row">
            <div class="example-text">
              <p class="example-en">${highlight(v.en, v.word)}</p>
              <p class="example-zh">${escapeHTMLSafe(v.zhEx)}</p>
            </div>
            <button class="speak-btn ex-speak" aria-label="Pronounce example sentence">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.speak-btn')) return;
      card.classList.toggle('flipped');
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.classList.toggle('flipped');
      }
    });

    const frontBtn = card.querySelector('.front-speak');
    frontBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.word, frontBtn); });
    const wordBtn = card.querySelector('.word-speak');
    wordBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.word, wordBtn); });
    const exBtn = card.querySelector('.ex-speak');
    exBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.en, exBtn); });

    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});

// Text-to-speech
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if (window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
} else {
  document.getElementById('ttsNote').style.display = 'block';
  document.querySelectorAll('.speak-btn').forEach(b => { b.disabled = true; b.style.opacity = 0.35; b.style.cursor = 'not-allowed'; });
}

function speak(text, btn){
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.92;
  const enVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;
  document.querySelectorAll('.speak-btn.playing').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  utter.onend = () => btn.classList.remove('playing');
  utter.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

// Steam background
const steamLayer = document.getElementById('steamLayer');
const STEAM_COUNT = 14;
for (let i = 0; i < STEAM_COUNT; i++){
  const s = document.createElement('div');
  s.className = 'steam';
  const height = 60 + Math.random() * 90;
  s.style.height = height + 'px';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.setProperty('--sway', (10 + Math.random() * 26) + 'px');
  const duration = 14 + Math.random() * 18;
  s.style.animationDuration = duration + 's';
  s.style.animationDelay = (-Math.random() * duration) + 's';
  steamLayer.appendChild(s);
}
</script>
