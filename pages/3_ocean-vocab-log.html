<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海詞典 Deep Sea Lexicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#031B2E;
    --deep:#053654;
    --deep2:#0A4A6E;
    --surf:#1C7A93;
    --foam:#EAF6F5;
    --pearl:#F4FBFA;
    --coral:#FF7A59;
    --coral-dim:#D9603F;
    --seaglow:#4FD9C4;
    --ink:#0B2438;
    --ink-dim:#3E5A68;
    --text-light:#E9F6F5;
    --text-light-dim:#9FC3CE;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(79,217,196,0.10), transparent 60%),
      linear-gradient(180deg, var(--abyss) 0%, var(--deep) 45%, var(--deep2) 100%);
    background-attachment:fixed;
    color:var(--text-light);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
    html{scroll-behavior:auto;}
  }

  /* ---------- BUBBLES ---------- */
  .bubbles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bubble{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.05) 70%);
    opacity:0.35;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.25; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- HERO ---------- */
  header.hero{
    position:relative;
    z-index:1;
    padding:60px 24px 0;
  }
  .hero-inner{
    max-width:960px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:32px;
    flex-wrap:wrap;
    padding-bottom:44px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--seaglow);
    margin:0 0 14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(32px,5.2vw,50px);
    line-height:1.08;
    margin:0 0 10px;
    color:var(--text-light);
  }
  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--text-light-dim);
  }
  .hero-sub{
    font-size:14.5px;
    color:var(--text-light-dim);
    max-width:48ch;
    line-height:1.65;
    margin:0;
  }
  .count-block{ text-align:right; flex-shrink:0; }
  .count-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(52px,8.5vw,80px);
    line-height:0.85;
    color:var(--seaglow);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 24px rgba(79,217,196,0.35);
  }
  .count-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-light-dim);
    margin-top:6px;
  }

  /* wave divider */
  .wave-divider{ display:block; width:100%; height:56px; }
  .wave-divider path{ fill:var(--pearl); }

  /* ---------- TABS ---------- */
  nav.tabs{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(3,27,46,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(233,246,245,0.08);
    padding:14px 24px;
  }
  .tabs-inner{
    max-width:960px;
    margin:0 auto;
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:thin;
    padding-bottom:2px;
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    background:transparent;
    border:1px solid rgba(233,246,245,0.18);
    color:var(--text-light-dim);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab-btn:hover{ color:var(--text-light); border-color:rgba(233,246,245,0.4); }
  .tab-btn.active{
    background:var(--seaglow);
    border-color:var(--seaglow);
    color:var(--abyss);
    font-weight:600;
  }
  .tab-btn .n{ opacity:0.65; margin-left:4px; }
  .tab-btn.active .n{ opacity:0.55; }

  /* ---------- MAIN ---------- */
  main{
    position:relative;
    z-index:1;
    max-width:960px;
    margin:0 auto;
    padding:36px 24px 90px;
  }
  .date-section{ margin-bottom:46px; }
  .date-heading{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 18px;
    padding-bottom:8px;
    border-bottom:1px dashed rgba(233,246,245,0.18);
  }
  .date-heading .d{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    color:var(--text-light);
  }
  .date-heading .c{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-light-dim);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:16px;
  }

  /* ---------- FLIP CARD ---------- */
  .flashcard{
    perspective:1200px;
    height:170px;
    cursor:pointer;
  }
  .flashcard-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }

  .card-face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:10px;
    padding:16px;
    display:flex;
    flex-direction:column;
  }

  .card-front{
    background:
      radial-gradient(circle at 85% 15%, rgba(79,217,196,0.18), transparent 55%),
      linear-gradient(160deg, var(--deep2), var(--surf));
    border:1px solid rgba(233,246,245,0.18);
    justify-content:space-between;
    box-shadow:0 10px 22px -14px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .front-top{ display:flex; justify-content:flex-end; }
  .front-top .speak-btn{
    background:rgba(3,27,46,0.55);
    color:var(--seaglow);
  }
  .front-top .speak-btn:hover{ background:var(--coral-dim); color:#fff; }
  .front-word{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    line-height:1.25;
    color:var(--text-light);
    margin:auto 0;
  }
  .flip-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.05em;
    color:var(--text-light-dim);
    text-align:right;
  }

  .card-back{
    background:var(--pearl);
    color:var(--ink);
    transform:rotateY(180deg);
    border:1px solid #d3e8e6;
    box-shadow:0 10px 22px -14px rgba(0,0,0,0.5);
    overflow-y:auto;
  }
  .back-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .back-word{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.2;
    margin:0;
  }
  .pos-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.03em;
    color:#fff;
    background:var(--surf);
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    margin-top:2px;
    display:inline-block;
  }
  .speak-btn{
    border:none;
    background:var(--abyss);
    color:var(--seaglow);
    width:26px;
    height:26px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .speak-btn:hover{ background:var(--coral-dim); transform:scale(1.08); }
  .speak-btn:active{ transform:scale(0.92); }
  .speak-btn.playing{ background:var(--coral); color:#fff; }
  .speak-btn svg{ width:12px; height:12px; }

  .zh-meaning{
    font-size:13px;
    color:var(--ink-dim);
    margin:4px 0 8px;
    line-height:1.4;
  }
  .example-row{
    display:flex;
    align-items:flex-start;
    gap:6px;
    border-top:1px dashed #d3e8e6;
    padding-top:8px;
    margin-top:auto;
  }
  .example-text{ flex:1; min-width:0; }
  .example-en{
    font-size:11.5px;
    line-height:1.45;
    color:#2c4650;
    margin:0 0 3px;
  }
  .example-en mark{
    background:none;
    color:var(--coral-dim);
    font-weight:600;
    text-decoration:underline;
    text-decoration-color:rgba(217,96,63,0.4);
    text-decoration-thickness:2px;
    text-underline-offset:2px;
  }
  .example-zh{
    font-size:11px;
    line-height:1.4;
    color:#6b8088;
    margin:0;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:28px 24px 40px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-light-dim);
    letter-spacing:0.04em;
  }

  .no-tts-note{
    display:none;
    position:relative;
    z-index:1;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--coral);
    text-align:center;
    padding:6px 24px 0;
  }
</style>
</head>

, "pos": "v.", "zh": "顯現；表現", "en": "The symptoms of the disease usually manifest within a few days.", "zhEx": "這種疾病的症狀通常會在幾天內顯現。"}, {"date": "2026-07-01", "word": "selectively", "pos": "adv.", "zh": "有選擇性地", "en": "Consumers often selectively choose products based on their brand loyalty.", "zhEx": "消費者常根據品牌忠誠度有選擇性地挑選產品。"}, {"date": "2026-07-01", "word": "dissonance", "pos": "n.", "zh": "不和諧；不一致（特指認知失調中的心理不協調）", "en": "The artist intentionally created dissonance in his music to evoke strong emotions.", "zhEx": "這位藝術家刻意在音樂中製造不和諧感，以喚起強烈的情緒。"}, {"date": "2026-07-01", "word": "magnitude", "pos": "n.", "zh": "巨大；重要性；（問題的）嚴重程度", "en": "The magnitude of the natural disaster required immediate international aid.", "zhEx": "這場天災的嚴重程度需要國際立即伸出援手。"}, {"date": "2026-07-01", "word": "principles", "pos": "n.", "zh": "原則；行為準則", "en": "She refused to compromise her artistic principles for commercial success.", "zhEx": "她拒絕為了商業成功而妥協自己的藝術原則。"}, {"date": "2026-07-01", "word": "circuitous", "pos": "adj.", "zh": "迂迴的；繞道的", "en": "The GPS led us on a circuitous route through narrow country roads.", "zhEx": "GPS導航讓我們繞了一條迂迴的路，穿過狹窄的鄉間小路。"}];

function escapeHTML(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function highlight(ex, word){
  const escaped = escapeHTML(ex);
  const escWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp("(" + escWord + ")", "i");
  return escaped.replace(re, "<mark>$1</mark>");
}

function fmtDateHeading(d){
  const [y,m,day] = d.split("-");
  return `${m}/${day}`;
}

const dates = [...new Set(VOCAB.map(v => v.date))].sort();

document.getElementById('totalCount').textContent = VOCAB.length;

// Tabs
const tabBar = document.getElementById('tabBar');
function makeTab(label, count, filterVal, active){
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (active ? ' active' : '');
  btn.dataset.filter = filterVal;
  btn.innerHTML = `${label}<span class="n">${count}</span>`;
  btn.onclick = () => setFilter(filterVal);
  return btn;
}
tabBar.appendChild(makeTab('全部', VOCAB.length, 'all', true));
dates.forEach(d => {
  const count = VOCAB.filter(v => v.date === d).length;
  tabBar.appendChild(makeTab(fmtDateHeading(d), count, d, false));
});

function setFilter(val){
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === val);
  });
  document.querySelectorAll('.date-section').forEach(sec => {
    sec.style.display = (val === 'all' || sec.dataset.date === val) ? '' : 'none';
  });
}

// Main content
const main = document.getElementById('main');
dates.forEach(d => {
  const words = VOCAB.filter(v => v.date === d);
  const section = document.createElement('section');
  section.className = 'date-section';
  section.dataset.date = d;

  const heading = document.createElement('div');
  heading.className = 'date-heading';
  heading.innerHTML = `<span class="d">${fmtDateHeading(d)}</span><span class="c">${words.length} words</span>`;
  section.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'grid';

  words.forEach(v => {
    const card = document.createElement('div');
    card.className = 'flashcard';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', `Flashcard for ${v.word}`);
    card.innerHTML = `
      <div class="flashcard-inner">
        <div class="card-face card-front">
          <div class="front-top">
            <button class="speak-btn front-speak" aria-label="Pronounce ${escapeHTML(v.word)}">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
          <div class="front-word">${escapeHTML(v.word)}</div>
          <div class="flip-hint">點擊翻面 ⟳</div>
        </div>
        <div class="card-face card-back">
          <div class="back-top">
            <div>
              <p class="back-word">${escapeHTML(v.word)}</p>
              <span class="pos-badge">${escapeHTML(v.pos)}</span>
            </div>
            <button class="speak-btn word-speak" aria-label="Pronounce ${escapeHTML(v.word)}">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
          <p class="zh-meaning">${escapeHTML(v.zh)}</p>
          <div class="example-row">
            <div class="example-text">
              <p class="example-en">${highlight(v.en, v.word)}</p>
              <p class="example-zh">${escapeHTML(v.zhEx)}</p>
            </div>
            <button class="speak-btn ex-speak" aria-label="Pronounce example sentence">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.speak-btn')) return;
      card.classList.toggle('flipped');
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.classList.toggle('flipped');
      }
    });

    const frontBtn = card.querySelector('.front-speak');
    frontBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.word, frontBtn); });
    const wordBtn = card.querySelector('.word-speak');
    wordBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.word, wordBtn); });
    const exBtn = card.querySelector('.ex-speak');
    exBtn.addEventListener('click', (e) => { e.stopPropagation(); speak(v.en, exBtn); });

    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});

// Text-to-speech
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if (window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
} else {
  document.getElementById('ttsNote').style.display = 'block';
  document.querySelectorAll('.speak-btn').forEach(b => { b.disabled = true; b.style.opacity = 0.35; b.style.cursor = 'not-allowed'; });
}

function speak(text, btn){
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.92;
  const enVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;
  document.querySelectorAll('.speak-btn.playing').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  utter.onend = () => btn.classList.remove('playing');
  utter.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

// Bubbles background
const bubbleLayer = document.getElementById('bubbles');
const BUBBLE_COUNT = 22;
for (let i = 0; i < BUBBLE_COUNT; i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 4 + Math.random() * 14;
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
  const duration = 10 + Math.random() * 16;
  b.style.animationDuration = duration + 's';
  b.style.animationDelay = (-Math.random() * duration) + 's';
  bubbleLayer.appendChild(b);
}
</script>
